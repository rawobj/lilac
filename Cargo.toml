[package]
name = "lilac"
version = "0.1.0"
edition = "2024"
description = "A fast, native Spotify client written in Rust with GPUI"
license = "MIT"

[dependencies]
gpui-kit = "=0.7.0"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "gzip", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
