[package]
name = "lilac"
version = "0.1.0"
edition = "2024"
description = "A fast, native Spotify client written in Rust with GPUI"
license = "MIT"

[dependencies]
gpui-kit = "=0.7.0"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
