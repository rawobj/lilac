[package]
name = "lilac"
version = "0.1.0"
edition = "2024"
description = "A fast, native Spotify client written in Rust with GPUI"
license = "MIT"

[build-dependencies]
embed-resource = "3.0.11"

[dependencies]
gpui-kit = "=0.11.0"
anyhow = "1.0.105"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.9.5"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "gzip", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
librespot-protocol = "0.8.0"
protobuf = "3.7.2"
log = "0.4"
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.11.0"
libpulse-binding = "2.30.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Function names stay in, so crash reports say where.
strip = "debuginfo"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
