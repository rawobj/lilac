[package]
name = "lilac"
version = "0.1.0"
edition = "2024"
description = "A fast, native Spotify client written in Rust with GPUI"
license = "MIT"

[dependencies]
gpui-kit = "=0.8.0"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "gzip", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8.0"
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
